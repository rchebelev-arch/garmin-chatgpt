openapi: 3.1.0
info:
  title: My Garmin Connect workouts
  version: 1.0.0
servers:
  - url: https://YOUR-DOMAIN.up.railway.app
security:
  - railwayBearer: []
paths:
  /activities:
    get:
      operationId: listGarminActivities
      summary: List workouts from my Garmin Connect account
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 10}
        - name: start
          in: query
          schema: {type: integer, minimum: 0, maximum: 10000, default: 0}
      responses:
        '200':
          description: List of workouts
          content:
            application/json:
              schema:
                type: object
                properties:
                  activities:
                    type: array
                    items: {type: object, additionalProperties: true}
  /activity/{activity_id}:
    get:
      operationId: getGarminActivity
      summary: Get the details of a workout by Garmin activity ID
      parameters:
        - name: activity_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: Workout details
          content:
            application/json:
              schema:
                type: object
                properties:
                  activity: {type: object, additionalProperties: true}
components:
  schemas: {}
  securitySchemes:
    railwayBearer:
      type: http
      scheme: bearer
